[project]
name = "firesight"
version = "0.1.0"
description = "Geospatial machine learning for wildfire risk forecasting in British Columbia"
readme = "README.md"
authors = [
    { name = "Thomas Yemane", email = "thomasyemane04@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "cdsapi>=0.7.7",
    "fastapi>=0.141.1",
    "matplotlib>=3.11.1",
    "netcdf4>=1.7.4",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "scikit-learn>=1.9.0",
    "uvicorn[standard]>=0.52.1",
    "xarray>=2026.7.0",
    "xgboost>=3.4.0",
]

[project.scripts]
firesight = "firesight:main"

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]

[tool.pytest.ini_options]
# repo root isn't on sys.path by default under `uv run pytest` (unlike `python -m pytest`),
# which breaks tests/test_api.py's `import api.main` for the root-level api/ package.
pythonpath = ["."]
